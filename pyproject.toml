[project]
name = "musician"
version = "0.1.0"
description = "Music practice app with synchronized lyrics and audio stem separation"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = { file = "LICENSE" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F63", "F7", "F82"]
